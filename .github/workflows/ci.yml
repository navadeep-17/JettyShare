name: CI

on:
  pull_request:
  push:
    branches: [implementation-core]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_key_for_build_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - run: npm run build
      - name: Public production smoke test
        run: |
          curl --retry 3 --retry-all-errors --retry-delay 5 -fsSL -D /tmp/jettyshare-headers.txt https://jettyshare-navadeep-17s-projects.vercel.app -o /tmp/jettyshare.html
          cat /tmp/jettyshare-headers.txt
          head -c 1200 /tmp/jettyshare.html
          echo
          grep -qE "JettyShare|COASTAL JETTY BOARD" /tmp/jettyshare.html

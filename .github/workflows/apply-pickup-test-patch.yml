name: Apply pickup verification test patch

on:
  push:
    branches:
      - feature-pickup-verification

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature-pickup-verification
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/patch_pickup_verification_tests.py
      - name: Commit updated release gates
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add e2e/core-flow.spec.ts e2e/lifecycle.spec.ts
          git commit -m 'test: update collection gates for pickup verification'
          git push origin HEAD:feature-pickup-verification
